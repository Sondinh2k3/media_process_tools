[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-dataset-tool"
version = "1.0.0"
description = "Công cụ desktop chuẩn bị bộ dữ liệu video"
requires-python = ">=3.11"
dependencies = ["PySide6==6.10.3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1"]

[project.scripts]
video-dataset-tool = "video_dataset_tool.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
# Avoid replacing native stderr descriptors while Qt multimedia threads are logging.
addopts = "--capture=sys"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
